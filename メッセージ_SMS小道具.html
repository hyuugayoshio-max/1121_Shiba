<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="メッセージ">
<meta name="application-name" content="メッセージ">
<meta name="format-detection" content="telephone=no, email=no, address=no">
<meta name="theme-color" content="#ffffff">
<title>メッセージ</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none; user-select: none; }
  html, body {
    position: fixed; inset: 0; width: 100%; height: 100%;
    overflow: hidden; overscroll-behavior: none;
    background: #fff; color: #111111;
    touch-action: manipulation;
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif,
                 "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji";
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  }
  img { -webkit-user-drag: none; user-drag: none; pointer-events: none; }

  #app {
    position: fixed; left: 0; right: 0; top: 0;
    height: 100%;
    display: flex; flex-direction: column;
    background: #fff;
    padding-top: env(safe-area-inset-top);
  }

  /* ステータスバー */
  #status {
    display: none; height: 26px; flex: none;
    align-items: center; justify-content: flex-end; gap: 6px;
    padding: 0 16px; color: #111;
  }
  #status.show { display: flex; }
  #status .g5 { font-size: 13px; font-weight: 700; letter-spacing: .2px; }

  /* ヘッダー */
  #header {
    position: relative; flex: none;
    display: flex; flex-direction: column; align-items: center;
    padding: 8px 12px 8px;
  }
  #back {
    position: absolute; left: 12px; top: 8px;
    width: 40px; height: 40px; border-radius: 50%;
    background: #f4f4f6; border: 1px solid #e4e4e8;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: #111; font-weight: 600;
  }
  #avatar {
    position: relative; z-index: 1;
    width: 54px; height: 54px; border-radius: 50%;
    background: linear-gradient(180deg, #b4bcc8, #8d96a4);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #avatar svg { width: 54px; height: 54px; display: block; }
  #numlabel {
    position: relative; z-index: 2;
    margin-top: -6px;
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 12px;
    background: #fff; border: 1px solid #e4e4e8; border-radius: 16px;
    font-size: 15px; font-weight: 700; color: #111; line-height: 1.2;
    white-space: nowrap;
  }
  #numlabel .chev { font-size: 15px; font-weight: 700; }

  /* トーク欄 */
  #thread {
    flex: 1 1 auto; min-height: 0;
    overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    touch-action: pan-y;
    display: flex; flex-direction: column;
    padding: 4px 14px 10px;
  }
  #sysLabel {
    flex: none; text-align: center; font-size: 11px; color: #8a8a8e;
    padding: 6px 0 10px;
  }
  #spacer { flex: 1 1 auto; }
  #msgs { flex: none; display: flex; flex-direction: column; }

  .msg { display: flex; }
  .msg.in  { justify-content: flex-start; }
  .msg.out { justify-content: flex-end; }
  .msg.same { margin-top: 6px; }    /* 同じ人が続けて送ったとき */
  .msg.diff { margin-top: 16px; }   /* 送り手が変わるとき */
  .msg:first-child { margin-top: 0; }

  .bubble {
    position: relative; z-index: 0;
    max-width: 86%;
    font-size: 16px; line-height: 1.4;
    padding: 7px 12px; border-radius: 18px;
    word-break: break-word; overflow-wrap: anywhere;
    white-space: pre-wrap;
  }
  @media (max-width: 379.98px) { .bubble { font-size: 15px; } }
  .in  .bubble { background: #e9e9eb; color: #111111; }
  .out .bubble { background: #3fc35f; color: #fff; }

  /* しっぽ */
  .bubble.tail::before, .bubble.tail::after {
    content: ""; position: absolute; bottom: 0; height: 20px; z-index: -1;
  }
  .in .bubble.tail::before {
    left: -7px; width: 20px; background: #e9e9eb;
    border-bottom-right-radius: 16px 14px;
  }
  .in .bubble.tail::after {
    left: -26px; width: 26px; background: #fff;
    border-bottom-right-radius: 10px;
  }
  .out .bubble.tail::before {
    right: -7px; width: 20px; background: #3fc35f;
    border-bottom-left-radius: 16px 14px;
  }
  .out .bubble.tail::after {
    right: -26px; width: 26px; background: #fff;
    border-bottom-left-radius: 10px;
  }

  /* 写真 */
  .photo {
    display: block;
    width: var(--photoW, 240px);
    aspect-ratio: 3 / 4;
    border-radius: 16px; overflow: hidden;
    background: #dfe5dc;
  }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* 入力欄 */
  #composer {
    flex: none;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    background: #fff;
  }
  #app.kb #composer { padding-bottom: 6px; }   /* キーボード表示中は下の余白をなくす */
  #plus {
    flex: none; width: 38px; height: 38px; border-radius: 50%;
    background: #f4f4f6; border: 1px solid #e4e4e8;
    display: flex; align-items: center; justify-content: center;
  }
  #field {
    position: relative; flex: 1 1 auto; min-width: 0;
    height: 38px; border-radius: 19px;
    border: 1px solid #dcdce0; background: #fff;
    display: flex; align-items: center;
  }
  #input {
    flex: 1 1 auto; min-width: 0; height: 100%;
    display: flex; align-items: center; overflow: hidden;
    padding: 0 6px 0 14px;
    font-size: 16px; color: #111; white-space: nowrap;
    direction: ltr;
  }
  #input #ph { color: #b0b0b5; position: absolute; left: 14px; pointer-events: none; }
  #field.has #ph, #field.focus #ph { }
  #field.has #ph { display: none; }
  #txt { flex: none; }
  #tp { text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 4px; background: rgba(63,195,95,.14); border-radius: 3px; }
  #caret { flex: none; width: 2.5px; height: 21px; margin-left: 1px; background: #3fc35f; border-radius: 1px; visibility: hidden; }
  #field.focus #caret { visibility: visible; animation: blink 1s steps(1) infinite; }
  #field.focus.typing #caret { animation: none; opacity: 1; }   /* 打っている間は点灯、止めると点滅 */
  @keyframes blink { 50% { opacity: 0; } }

  /* 画面内キーボード */
  #app.kbopen #composer { padding-bottom: 6px; }
  #kb {
    display: none; flex: none;
    background: #e3e4e8;
    border-radius: 22px 22px 0 0;
    padding: 0 6px calc(4px + env(safe-area-inset-bottom));
  }
  #app.kbopen #kb { display: block; animation: kbup .22s ease-out; }
  @keyframes kbup { from { transform: translateY(100%); } to { transform: none; } }
  #cand {
    height: 46px; display: flex; align-items: center; gap: 4px;
    padding: 0 8px; overflow: hidden; white-space: nowrap;
  }
  #cand .cd { font-size: 19px; color: #111; padding: 7px 14px; border-radius: 9px; }
  #cand .cd + .cd { border-left: 1px solid #c8cad0; border-radius: 0; }
  #cand .cd.on { background: #b9bdc6; border-radius: 9px; }
  #cand .cd.next { animation: keyblink .9s ease-in-out infinite; border-radius: 9px; }
  #kb .grid {
    display: grid; grid-template-columns: repeat(5, 1fr);
    grid-auto-rows: 46px; gap: 7px 6px;
  }
  #kb .k {
    background: #fff; border-radius: 9px;
    box-shadow: 0 1px 0 rgba(0,0,0,.18);
    display: flex; align-items: center; justify-content: center;
    font-size: 25px; color: #111; line-height: 1;
  }
  #kb .k.s { font-size: 17px; }
  #kb .k.ret { grid-column: 5; grid-row: 3 / span 2; font-size: 17px; }
  #kb .k.on { background: #b9bdc6; }
  #kb .k.next { animation: keyblink .9s ease-in-out infinite; }
  @keyframes keyblink { 0%,100% { background: #fff; } 50% { background: #b9bdc6; } }
  #kb .bottom {
    display: flex; justify-content: space-between; align-items: center;
    height: 50px; padding: 0 18px;
  }
  #kb .bottom .k { background: transparent; box-shadow: none; width: 44px; height: 44px; }
  #kb .bottom .k.on { background: rgba(0,0,0,.08); border-radius: 50%; }
  #rightBtn { flex: none; width: 38px; height: 36px; display: flex; align-items: center; justify-content: center; margin-right: 1px; }
  #wave { display: block; }
  #send {
    display: none; width: 30px; height: 30px; border-radius: 50%;
    background: #3fc35f; align-items: center; justify-content: center;
  }
  #field.has #wave { display: none; }
  #field.has #send { display: flex; }
</style>
</head>
<body>
<div id="app">
  <div id="status">
    <!-- 電波4本 -->
    <svg width="18" height="12" viewBox="0 0 18 12" aria-hidden="true">
      <rect x="0"  y="8" width="3" height="4"  rx="0.8" fill="#111"/>
      <rect x="5"  y="5.5" width="3" height="6.5" rx="0.8" fill="#111"/>
      <rect x="10" y="3" width="3" height="9"  rx="0.8" fill="#111"/>
      <rect x="15" y="0" width="3" height="12" rx="0.8" fill="#111"/>
    </svg>
    <span class="g5">5G</span>
    <!-- 電池 約78% -->
    <svg width="26" height="13" viewBox="0 0 26 13" aria-hidden="true">
      <rect x="0.6" y="0.6" width="22" height="11.8" rx="3" fill="none" stroke="#111" stroke-opacity=".45" stroke-width="1.2"/>
      <rect x="2.3" y="2.3" width="14.2" height="8.4" rx="1.6" fill="#111"/>
      <rect x="23.6" y="4.2" width="1.8" height="4.6" rx="0.9" fill="#111" fill-opacity=".45"/>
    </svg>
  </div>

  <div id="header">
    <div id="back">＜</div>
    <div id="avatar">
      <svg viewBox="0 0 54 54" aria-hidden="true">
        <circle cx="27" cy="21" r="9" fill="#fff"/>
        <path d="M10 49c1.5-10 8.5-15.5 17-15.5S42.5 39 44 49z" fill="#fff"/>
      </svg>
    </div>
    <div id="numlabel"><span>+81 90 037 582</span><span class="chev">＞</span></div>
  </div>

  <div id="thread">
    <div id="sysLabel">テキストメッセージ・SMS</div>
    <div id="msgs"></div>
  </div>

  <div id="composer">
    <div id="plus">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M8 2v12M2 8h12" stroke="#111" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>
    <div id="field">
      <div id="input"><span id="ph">テキストメッセージ・SMS</span><span id="txt"><span id="tc"></span><span id="tp"></span></span><span id="caret"></span></div>
      <div id="rightBtn">
        <svg id="wave" width="20" height="18" viewBox="0 0 20 18" aria-hidden="true">
          <g stroke="#555" stroke-width="2" stroke-linecap="round">
            <path d="M2 7v4"/><path d="M6 4v10"/><path d="M10 1v16"/><path d="M14 4v10"/><path d="M18 7v4"/>
          </g>
        </svg>
        <div id="send">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M8 13V3M3.5 7.5L8 3l4.5 4.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <div id="kb">
    <div id="cand"></div>
    <div class="grid">
      <div class="k s">→</div><div class="k" data-g="あ">あ</div><div class="k" data-g="か">か</div><div class="k" data-g="さ">さ</div>
      <div class="k" data-del="1"><svg width="28" height="20" viewBox="0 0 28 20"><path d="M9 1.5h15.5a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H9L1.5 10z" fill="none" stroke="#111" stroke-width="1.7" stroke-linejoin="round"/><path d="M13 6l7 8M20 6l-7 8" stroke="#111" stroke-width="1.7" stroke-linecap="round"/></svg></div>
      <div class="k s">↺</div><div class="k" data-g="た">た</div><div class="k" data-g="な">な</div><div class="k" data-g="は">は</div><div class="k s" id="kSpace">空白</div>
      <div class="k s">ABC</div><div class="k" data-g="ま">ま</div><div class="k" data-g="や">や</div><div class="k" data-g="ら">ら</div>
      <div class="k ret" id="kRet">改行</div>
      <div class="k"><svg width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="11" fill="none" stroke="#111" stroke-width="1.7"/><circle cx="9.3" cy="10.5" r="1.4" fill="#111"/><circle cx="16.7" cy="10.5" r="1.4" fill="#111"/><path d="M7.5 15c1.3 2.6 3.3 3.8 5.5 3.8s4.2-1.2 5.5-3.8z" fill="#111"/></svg></div>
      <div class="k s">^^</div><div class="k" data-g="わ">わ</div><div class="k s" data-g="記">、。?!</div>
    </div>
    <div class="bottom">
      <div class="k"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#111" stroke-width="1.6"><circle cx="14" cy="14" r="11.5"/><ellipse cx="14" cy="14" rx="5" ry="11.5"/><path d="M2.5 14h23M4.5 8h19M4.5 20h19"/></svg></div>
      <div class="k"><svg width="20" height="28" viewBox="0 0 20 28" fill="none" stroke="#111" stroke-width="1.7" stroke-linecap="round"><rect x="6" y="2" width="8" height="15" rx="4"/><path d="M2 13a8 8 0 0 0 16 0M10 21v5M6 26h8"/></svg></div>
    </div>
  </div>
</div>

const SCRIPT = [
  // parts：打ち込む順番。
  //   "ひらがな"            → 1キー1文字でそのまま入る
  //   ["よみ", "変換後"]    → よみを1キー1文字で打つ（下線つき）→ 次の1回で変換される
  { parts: ["こんばんは、", ["みぶんしょう", "身分証"], ["おかえし", "お返し"], "したいです"],
    replies: [
      { text: "こんばんは！" },
      { text: "ご連絡ありがとうございます😊" },
      { text: "嬉しいです！" },
      { image: FLOWER_SRC },
      { text: "今、部屋に花を飾っていました💐" }
    ] }
];

/* ===== 状態 ===== */
const $ = (id) => document.getElementById(id);
const app = $("app"), thread = $("thread"), msgsEl = $("msgs");
const input = $("input"), field = $("field"), sendBtn = $("send");
let stage = 0;          // 何回目の入力か
let pos = 0;            // 何回押したか（states の位置）
let typed = "";         // 入力欄に入っている文章（確定＋変換前）
let timers = [];
let cueReadyAt = Infinity;   // この時刻を過ぎたらタップで最後のメッセージが届く
let lastSide = null;

const chars = (s) => Array.from(s);           // 絵文字も1文字扱い

// 1回押すごとの入力欄の状態を作る { c: 確定した文字, p: 変換前の文字, next: 次に押す内容, cand: 変換候補 }
function buildStates(step) {
  const st = [{ c: "", p: "" }];
  if (!step.parts) return st;
  let c = "";
  for (const part of step.parts) {
    if (typeof part === "string") {
      for (const ch of chars(part)) { c += ch; st.push({ c, p: "" }); }
    } else {
      const [yomi, out] = part; let p = "";
      for (const ch of chars(yomi)) { p += ch; st.push({ c, p, cand: [out, yomi] }); }
      c += out; st.push({ c, p: "", conv: true });
    }
  }
  return st;
}
let states = SCRIPT.map(buildStates);
function cur() { return (states[stage] || [{ c: "", p: "" }])[pos]; }
function nextState() { const s = states[stage]; return s && s[pos + 1]; }
function isComplete() { const s = states[stage]; return !!s && pos > 0 && pos >= s.length - 1; }
function fullText(i) { const s = states[i]; return s ? s[s.length - 1].c : ""; }

/* --- 次に押すキーを点滅させる --- */
const KANA_ROWS = {
  "あ": "あいうえおぁぃぅぇぉ", "か": "かきくけこがぎぐげご", "さ": "さしすせそざじずぜぞ",
  "た": "たちつてとだぢづでどっ", "な": "なにぬねの", "は": "はひふへほばびぶべぼぱぴぷぺぽ",
  "ま": "まみむめも", "や": "やゆよゃゅょ", "ら": "らりるれろ", "わ": "わをんー〜",
  "記": "、。?!？！・"
};
function groupFor(ch) {
  for (const g in KANA_ROWS) if (KANA_ROWS[g].includes(ch)) return g;
  return null;
}
function updateNextKey() {
  document.querySelectorAll("#kb .next").forEach((k) => k.classList.remove("next"));
  if (!app.classList.contains("kbopen")) return;
  const nx = nextState(); if (!nx) return;
  if (nx.conv) {                       // 変換：候補の漢字を点滅
    const c = document.querySelector("#cand .cd"); if (c) c.classList.add("next");
    return;
  }
  const now = cur();
  const ch = nx.p.length > now.p.length ? chars(nx.p).pop() : chars(nx.c).pop();
  const g = groupFor(ch);
  const key = g && document.querySelector('#kb .k[data-g="' + g + '"]');
  if (key) key.classList.add("next");
}

let typingTimer = null;
function markTyping() {
  field.classList.add("typing");
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => field.classList.remove("typing"), 500);
}
function render() {
  const st = cur();
  typed = st.c + st.p;
  $("tc").textContent = st.c;
  $("tp").textContent = st.p;
  // 変換候補バー と キーの表示（変換中は「次候補」「確定」）
  const cand = $("cand"); cand.innerHTML = "";
  if (st.p && st.cand) {
    st.cand.forEach((w, i) => {
      const el = document.createElement("span");
      el.className = "cd"; el.textContent = w; cand.appendChild(el);
    });
  }
  $("kSpace").textContent = st.p ? "次候補" : "空白";
  $("kRet").textContent = st.p ? "確定" : "改行";
  updateNextKey();
  field.classList.toggle("has", typed.length > 0);
  // 長い文章は末尾が見えるように
  const inp = $("input"), tx = $("txt");
  tx.style.marginLeft = "";
  const over = tx.offsetWidth + 4 - (inp.clientWidth - 20);
  if (over > 0) tx.style.marginLeft = (-over) + "px";
}
function addOne() {
  const s = states[stage]; if (!s) return;
  if (pos < s.length - 1) {
    const conv = s[pos + 1].conv;
    pos++;
    if (conv) {                         // 変換した瞬間、候補を光らせる
      const c = document.querySelector("#cand .cd");
      if (c) c.classList.add("on");
    }
  }
}
function delOne() { if (pos > 0) pos--; }

/* --- 画面内キーボード：どのキーを押しても台本の文字が入る --- */
function openKb() {
  if (app.classList.contains("kbopen")) return;
  app.classList.add("kbopen"); field.classList.add("focus"); updateNextKey(); scrollBottom();
}
function closeKb() { app.classList.remove("kbopen"); field.classList.remove("focus"); updateNextKey(); }
function onField(e) {
  if (sendBtn.contains(e.target)) return;
  if (!SCRIPT[stage] || SCRIPT[stage].cue) return;
  e.preventDefault();
  if (!app.classList.contains("kbopen")) { e.stopPropagation(); openKb(); }
}
field.addEventListener("touchstart", onField, { passive: false });
field.addEventListener("mousedown", onField);

// すき間を押したときは、いちばん近いキーを光らせる
function nearestKey(x, y) {
  let best = null, bd = 1e9;
  document.querySelectorAll("#kb .k").forEach((k) => {
    const r = k.getBoundingClientRect();
    const dx = Math.max(r.left - x, 0, x - r.right), dy = Math.max(r.top - y, 0, y - r.bottom);
    const d = dx * dx + dy * dy; if (d < bd) { bd = d; best = k; }
  });
  return best;
}
function keyDown(e) {
  e.preventDefault(); e.stopPropagation();
  const pt = e.touches ? e.touches[0] : e;
  const k = e.target.closest(".k") || nearestKey(pt.clientX, pt.clientY);
  if (k) k.classList.add("on");
  if (isComplete()) { doSend(); return; }   // 打ち終わっていたら、どこを押しても送信
  if (k && k.dataset.del) delOne(); else addOne();
  markTyping(); render();
}
// キーボードが出ている間は、画面のどこを押しても1文字入る（ヘッダーと送信ボタンは除く）
function anywhere(e) {
  if (!app.classList.contains("kbopen")) return;
  const t = e.target;
  if (kbEl.contains(t) || sendBtn.contains(t) || $("header").contains(t) || $("status").contains(t)) return;
  if (isComplete()) { doSend(); return; }   // 打ち終わっていたら、どこを押しても送信
  addOne(); markTyping(); render();
}
function keyUp() { document.querySelectorAll("#kb .k.on").forEach((k) => k.classList.remove("on")); }
/* --- 最後のメッセージ：画面タップで届く --- */
function onCue(e) {
  const step = SCRIPT[stage];
  if (!step || !step.cue || Date.now() < cueReadyAt) return;
  if ($("header").contains(e.target) || $("status").contains(e.target)) return;
  stage++; cueReadyAt = Infinity;
  step.replies.forEach((r, i) => {
    timers.push(setTimeout(() => addMessage("in", r), CUE_DELAY_MS + i * REPLY_INTERVAL_MS));
  });
}
document.addEventListener("touchstart", onCue, { passive: true });
document.addEventListener("mousedown", (e) => { if (!("ontouchstart" in window)) onCue(e); });

const kbEl = $("kb");
kbEl.addEventListener("touchstart", keyDown, { passive: false });
kbEl.addEventListener("mousedown", keyDown);
document.addEventListener("touchstart", anywhere, { passive: true });
document.addEventListener("mousedown", (e) => { if (!("ontouchstart" in window)) anywhere(e); });
["touchend", "touchcancel", "mouseup", "mouseleave"].forEach((ev) => kbEl.addEventListener(ev, () => setTimeout(keyUp, 60)));

/* --- 送信 --- */
sendBtn.addEventListener("pointerdown", (e) => e.preventDefault()); // キーボードを閉じない
sendBtn.addEventListener("mousedown", (e) => e.preventDefault());
sendBtn.addEventListener("touchstart", (e) => { e.preventDefault(); e.stopPropagation(); doSend(); }, { passive: false });
sendBtn.addEventListener("click", (e) => { e.preventDefault(); doSend(); });

function doSend() {
  if (!typed.length || !SCRIPT[stage]) return;
  if (isComplete()) typed = fullText(stage);
  const step = SCRIPT[stage];
  addMessage("out", { text: typed });
  stage++; pos = 0;
  closeKb();   // 送信したらキーボードを閉じる
  render();
  cueReadyAt = Date.now() + REPLY_DELAY_MS + (step.replies.length - 1) * REPLY_INTERVAL_MS + 300;
  step.replies.forEach((r, i) => {
    timers.push(setTimeout(() => addMessage("in", r), REPLY_DELAY_MS + i * REPLY_INTERVAL_MS));
  });
}

function addMessage(side, m) {
  const row = document.createElement("div");
  row.className = "msg " + side;
  const prev = msgsEl.lastElementChild;
  if (prev) {
    row.classList.add(lastSide === side ? "same" : "diff");
    if (lastSide === side) {
      const pb = prev.querySelector(".bubble"); if (pb) pb.classList.remove("tail");
    }
  }
  if (m.image) {
    const box = document.createElement("div");
    box.className = "photo";
    const img = new Image();
    img.src = m.image; img.alt = ""; img.draggable = false;
    img.addEventListener("load", scrollBottom);
    box.appendChild(img);
    row.appendChild(box);
  } else {
    const b = document.createElement("div");
    b.className = "bubble tail";
    b.textContent = m.text;
    row.appendChild(b);
  }
  msgsEl.appendChild(row);
  lastSide = side;
  scrollBottom();
}
function scrollBottom() {
  requestAnimationFrame(() => { thread.scrollTop = thread.scrollHeight; });
}

/* --- リセット（アイコン3回タップ） --- */
function resetAll() {
  timers.forEach(clearTimeout); timers = [];
  msgsEl.innerHTML = ""; lastSide = null;
  stage = 0; pos = 0; cueReadyAt = Infinity; closeKb(); render();
  thread.scrollTop = 0;
}
let taps = 0, tapTimer = null;
function avatarTap(e) {
  e.preventDefault();
  taps++;
  clearTimeout(tapTimer);
  if (taps >= 3) { taps = 0; resetAll(); return; }
  tapTimer = setTimeout(() => { taps = 0; }, TRIPLE_TAP_MS);
}
$("avatar").addEventListener("touchstart", avatarTap, { passive: false });
$("avatar").addEventListener("mousedown", avatarTap);

/* --- ステータスバー表示切替 --- */
$("numlabel").addEventListener("click", () => {
  $("status").classList.toggle("show");
  layout();
});

/* --- キーボード対応（visualViewport） & 写真サイズ --- */
let baseH = window.innerHeight;
function layout() {
  const vv = window.visualViewport;
  const h = vv ? vv.height : window.innerHeight;
  const top = vv ? vv.offsetTop : 0;
  app.style.height = h + "px";
  app.classList.toggle("kb", window.innerHeight - h > 120);
  app.style.transform = "translateY(" + top + "px)";
  // 写真：画面幅の62%（最大240px）。画面が低い端末では縮めて1画面に収める
  if (!vv || vv.height > baseH * 0.85) baseH = window.innerHeight;
  const w = window.innerWidth;
  const fit = (baseH - 560) * 0.75;
  const pw = Math.max(110, Math.min(w * 0.62, 240, fit));
  document.documentElement.style.setProperty("--photoW", Math.round(pw) + "px");
  scrollBottom();
}
if (window.visualViewport) {
  visualViewport.addEventListener("resize", layout);
  visualViewport.addEventListener("scroll", layout);
}
window.addEventListener("resize", layout);
window.addEventListener("orientationchange", () => setTimeout(layout, 300));
layout();

/* --- 拡大・長押し・選択・ドラッグ・引っ張りを止める --- */
["gesturestart", "gesturechange", "gestureend"].forEach((ev) =>
  document.addEventListener(ev, (e) => e.preventDefault(), { passive: false }));
document.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("selectstart", (e) => e.preventDefault());
document.addEventListener("dragstart", (e) => e.preventDefault());
document.addEventListener("dblclick", (e) => e.preventDefault(), { passive: false });
let lastTouchEnd = 0;
document.addEventListener("touchend", (e) => {
  const now = Date.now();
  if (now - lastTouchEnd < 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });
let startY = 0;
document.addEventListener("touchstart", (e) => {
  if (e.touches.length > 1) { e.preventDefault(); return; }
  startY = e.touches[0].clientY;
}, { passive: false });
document.addEventListener("touchmove", (e) => {
  if (e.touches.length > 1) { e.preventDefault(); return; }
  if (!thread.contains(e.target)) { e.preventDefault(); return; }
  const dy = e.touches[0].clientY - startY;
  const atTop = thread.scrollTop <= 0;
  const atBottom = thread.scrollTop + thread.clientHeight >= thread.scrollHeight - 1;
  if (thread.scrollHeight <= thread.clientHeight || (atTop && dy > 0) || (atBottom && dy < 0)) e.preventDefault();
}, { passive: false });
window.addEventListener("scroll", () => { if (window.scrollY) window.scrollTo(0, 0); });

render();
</script>
</body>
